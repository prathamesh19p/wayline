global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'wayline-monitor'

scrape_configs:
  - job_name: 'wayline-app'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    scrape_timeout: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
