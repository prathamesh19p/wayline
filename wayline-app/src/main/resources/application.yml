spring:
  application:
    name: wayline-payment-platform
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: false
    show-sql: false
    open-in-view: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wayline}
    username: ${DB_USERNAME:wayline}
    password: ${DB_PASSWORD:wayline_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      linger-ms: 10
    consumer:
      group-id: wayline-consumers
      auto-offset-reset: earliest
      max-poll-records: 500
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      # Every repository here is JPA-backed; without this Spring Data inspects all 13 of them as
      # Redis candidates and logs a warning for each at startup.
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

logging:
  level:
    root: INFO
    com.wayline: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

wayline:
  auth:
    username: ${WAYLINE_AUTH_USERNAME:}
    password: ${WAYLINE_AUTH_PASSWORD:}
    role: ${WAYLINE_AUTH_ROLE:MERCHANT}
  security:
    allowed-origin: ${WAYLINE_ALLOWED_ORIGIN:http://localhost:3000}
    rate-limit:
      api-per-minute: ${WAYLINE_API_RATE_LIMIT_PER_MINUTE:120}
      login-per-minute: ${WAYLINE_LOGIN_RATE_LIMIT_PER_MINUTE:10}
    jwt:
      # No default: the application must not start with a guessable signing key.
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:1h}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:30d}
  notification:
    webhook-url: ${WAYLINE_NOTIFICATION_WEBHOOK_URL:}
  tracing:
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  webhooks:
    secret: ${WAYLINE_WEBHOOK_SECRET:}
  payment:
    idempotency-cache-ttl-minutes: 60
    webhook-timeout-seconds: 30
    webhook-max-retries: 3
  provider:
    timeout-seconds: 10
    retry-attempts: 2
    circuit-breaker-threshold: 50
    circuit-breaker-wait-duration-seconds: 60
  reconciliation:
    batch-size: 1000
    enabled: true
    schedule-cron: "0 0 2 * * *"
