spring:
  application:
    name: wayline-payment-platform
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: false
    show-sql: false
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5432/wayline
    username: wayline
    password: wayline_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      linger-ms: 10
    consumer:
      group-id: wayline-consumers
      auto-offset-reset: earliest
      max-poll-records: 500
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
  security:
    jwt:
      secret: ${JWT_SECRET:your-super-secret-jwt-key-change-in-production}
      expiration: 3600000

logging:
  level:
    root: INFO
    com.wayline: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

wayline:
  auth:
    username: ${WAYLINE_AUTH_USERNAME:}
    password: ${WAYLINE_AUTH_PASSWORD:}
    role: ${WAYLINE_AUTH_ROLE:MERCHANT}
  security:
    allowed-origin: ${WAYLINE_ALLOWED_ORIGIN:http://localhost:3000}
  notification:
    webhook-url: ${WAYLINE_NOTIFICATION_WEBHOOK_URL:}
  webhooks:
    secret: ${WAYLINE_WEBHOOK_SECRET:}
  payment:
    idempotency-cache-ttl-minutes: 60
    webhook-timeout-seconds: 30
    webhook-max-retries: 3
  provider:
    timeout-seconds: 10
    retry-attempts: 2
    circuit-breaker-threshold: 50
    circuit-breaker-wait-duration-seconds: 60
  reconciliation:
    batch-size: 1000
    enabled: true
    schedule-cron: "0 0 2 * * *"
